# System defaults; ~/.tmux.conf or ~/.config/tmux/tmux.conf loads afterward.
set -g mouse on
set -g status-position top
set -g renumber-windows on
set -g default-shell /bin/bash
set -g history-limit 10000

# Preserve tab space below 80 columns; wider terminals keep the full status bar.
set -g status-left '#{?#{e|<:#{client_width},80},,[#S] }'
set -g status-right '#{?#{e|<:#{client_width},80},,"#{=21:host}" %H:%M %d-%b-%y}'
set -g window-status-format '#I:#{?#{e|<:#{client_width},80},#{=10:window_name},#W}#F'
set -g window-status-current-format '#I:#{?#{e|<:#{client_width},80},#{=10:window_name},#W}#F'
# Keep the standard Ctrl+B prefix and bindings.
