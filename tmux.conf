# System defaults; ~/.tmux.conf or ~/.config/tmux/tmux.conf loads afterward.
set -g mouse on
set -g status-position bottom
set -g renumber-windows on
set -g default-shell /bin/bash
set -g history-limit 10000

set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold] #S #[default] "
set -g status-right "#[fg=#11111b,bg=#94e2d5,bold] %H:%M #[default]"
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#f9e2af,bg=#45475a,bold] #I:#W #[default]"
# Keep the standard Ctrl+B prefix and bindings.

# Remobi drawer shortcuts.
bind-key F5 display-popup -E -w 95% -h 60% -T 'AI Usage' 'node /opt/codex-terminal/drawer.mjs usage; printf "\nPress Enter to close. "; read -r _'
bind-key F6 display-popup -E -w 95% -h 90% -T 'Quick Shell' -d '#{pane_current_path}' /bin/bash
bind-key F7 display-popup -E -w 95% -h 90% -T Diff -d '#{pane_current_path}' '/bin/bash /opt/codex-terminal/diff.sh'
bind-key F8 display-popup -E -w 95% -h 60% -T Ports 'node /opt/codex-terminal/drawer.mjs ports; printf "\nPress Enter to close. "; read -r _'
bind-key F9 display-menu -T 'Start Codex' -x C -y C \
  'Start normally' n 'new-window -n Codex -c "#{pane_current_path}" codex' \
  'YOLO (no approvals or sandbox)' y 'new-window -n Codex -c "#{pane_current_path}" codex --yolo'
