# System defaults; ~/.tmux.conf or ~/.config/tmux/tmux.conf loads afterward.
set -g mouse on
set -g status-position bottom
set -g renumber-windows on
set -g default-shell /bin/bash
set -g history-limit 10000

set -g status-style "bg=#1e1e2e,fg=#a6adc8"
set -g status-left "#[fg=#11111b,bg=#89b4fa,bold] #S #[default] "
set -g status-right "#[fg=#11111b,bg=#94e2d5,bold] %H:%M #[default]"
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#f9e2af,bg=#45475a,bold] #I:#W #[default]"
# Keep the standard Ctrl+B prefix and bindings.
