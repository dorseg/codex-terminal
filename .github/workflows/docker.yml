name: Build and publish Codex Terminal

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Test gateway and launcher
        timeout-minutes: 2
        run: npm test

  build:
    if: github.event_name != 'pull_request'
    needs: test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache-filters: remobi,herdr
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Minimal browser-based Codex CLI environment

  smoke:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke-test native PTY and gateway
        shell: bash
        run: |
          docker run --rm --platform linux/${{ matrix.architecture }} \
            -v "$PWD/scripts/smoke.mjs:/tmp/smoke.mjs:ro" \
            "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" node /tmp/smoke.mjs
      - name: Check native restart and volume-backed container recreation
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          arch="linux/${{ matrix.architecture }}"
          docker run --rm --platform "$arch" \
            -v "$PWD/scripts/herdr-state-smoke.mjs:/tmp/herdr-state-smoke.mjs:ro" \
            "$image" node /tmp/herdr-state-smoke.mjs
          volume="herdr-state-${GITHUB_RUN_ID}-${{ matrix.architecture }}"
          docker volume create "$volume"
          trap 'docker volume rm "$volume"' EXIT
          docker run --rm --platform "$arch" --user root -v "$volume:/smoke-state" "$image" chown node:node /smoke-state
          for phase in save restore; do
            docker run --rm --platform "$arch" -v "$volume:/smoke-state" \
              -e SMOKE_STATE_HOME=/smoke-state -e SMOKE_STATE_PHASE="$phase" \
              -v "$PWD/scripts/herdr-state-smoke.mjs:/tmp/herdr-state-smoke.mjs:ro" \
              "$image" node /tmp/herdr-state-smoke.mjs
          done

  promote:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote validated commit to latest
        shell: bash
        run: docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY,,}:latest" "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
