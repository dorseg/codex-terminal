name: Build and publish Codex Terminal

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialize releases so candidate selection and promotion cannot race.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  candidates:
    runs-on: ubuntu-latest
    outputs:
      default-tag: ${{ steps.tags.outputs.default-tag }}
      browser-tag: ${{ steps.tags.outputs.browser-tag }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select unused candidate tags
        id: tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for variant in default browser; do
            suffix=""
            if [ "$variant" = browser ]; then suffix="-browser"; fi
            tag="${GITHUB_SHA}${suffix}"
            # Preserve commit tags on scheduled builds, manual builds and reruns.
            if docker buildx imagetools inspect "$image:$tag" > /dev/null 2> /tmp/manifest-error; then
              tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}${suffix}"
            elif ! grep -Eqi 'manifest unknown|not found|no such manifest' /tmp/manifest-error; then
              cat /tmp/manifest-error >&2
              exit 1
            fi
            echo "$variant-tag=$tag" >> "$GITHUB_OUTPUT"
          done

  build:
    needs: candidates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            tag: ${{ needs.candidates.outputs.default-tag }}
          - variant: browser
            tag: ${{ needs.candidates.outputs.browser-tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Test gateway and launcher
        timeout-minutes: 2
        run: npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache-filters: remobi,herdr,browser
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Minimal browser-based Codex CLI environment

  smoke:
    timeout-minutes: 25
    needs: [candidates, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        variant: [default, browser]
        include:
          - variant: default
            tag: ${{ needs.candidates.outputs.default-tag }}
          - variant: browser
            tag: ${{ needs.candidates.outputs.browser-tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate unit suite, terminal, persistence and image variant
        shell: bash
        run: |
          sh scripts/image-smoke.sh \
            "ghcr.io/${GITHUB_REPOSITORY,,}:${{ matrix.tag }}" \
            '${{ matrix.architecture }}' '${{ matrix.variant }}'

  promote:
    needs: [candidates, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both variants after every architecture passes
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image:${{ needs.candidates.outputs.default-tag }}"
          docker buildx imagetools create --tag "$image:browser" "$image:${{ needs.candidates.outputs.browser-tag }}"
