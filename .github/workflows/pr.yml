name: Validate pull requests

on:
  pull_request:
    paths:
      - 'app/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Test gateway and launcher
        timeout-minutes: 2
        run: npm test

  image:
    name: Image smoke (${{ matrix.variant }}, ${{ matrix.architecture }})
    needs: unit
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
        variant: [default, browser]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build local validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.variant }}
          platforms: linux/${{ matrix.architecture }}
          load: true
          push: false
          pull: true
          no-cache-filters: remobi,herdr,browser
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          tags: codex-terminal:pr-test
      - name: Validate unit suite, terminal, persistence and image variant
        timeout-minutes: 20
        run: sh scripts/image-smoke.sh codex-terminal:pr-test '${{ matrix.architecture }}' '${{ matrix.variant }}'
